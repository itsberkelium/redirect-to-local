<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirect to Local</title>
    <link rel="stylesheet" href="popup.css">
    <script src="shared.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <span class="eyebrow">FIREFOX / DEV TOOLS</span>
      <h1>Redirect to Local</h1>
      <p class="intro">Your website, served locally whenever your dev server is running.</p>
      <button id="pause" type="button" disabled>Pause redirects</button>
      <p id="pause-state" class="hint" role="status">Loading redirect status…</p>
      <form id="settings-form">
        <label for="port">Localhost port</label>
        <input id="port" name="port" type="number" min="1" max="65535" step="1" placeholder="3000" required>
        <label for="url">Website URL</label>
        <input id="url" name="url" type="text" placeholder="https://example.com" spellcheck="false" autocomplete="off" required aria-describedby="url-help">
        <p id="url-help" class="hint">Matches this exact hostname and port on HTTP or HTTPS. All paths and query strings are kept. Subdomains are separate.</p>
        <button id="save" type="submit">Save settings</button>
        <button id="clear" class="secondary" type="button">Clear settings</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
